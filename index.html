<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpinGift</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: #090b10;
      color: #ffffff;
      padding-bottom: 95px;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.28), transparent 45%),
        radial-gradient(circle at 85% 40%, rgba(139, 92, 246, 0.24), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.22), transparent 50%);
      background-attachment: fixed;
    }
    .glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    header {
      position: sticky;
      top: 10px;
      z-index: 15;
      margin: 10px 14px 0;
      padding: 12px 16px;
      border-radius: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
    .ton-btn {
      background: linear-gradient(145deg, rgba(56, 189, 248, 0.26), rgba(56, 189, 248, 0.08));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #7dd3fc;
      border: 1px solid rgba(125, 211, 252, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab { display: none; padding: 16px 14px; }
    .tab.active { display: block; animation: fade 0.22s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card { border-radius: 26px; padding: 16px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gift { border-radius: 26px; padding: 14px 12px; text-align: center; }
    .icon { font-size: 46px; margin: 6px 0 8px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4)); }
    .btn {
      width: 100%;
      border-radius: 18px;
      padding: 10px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.12s ease;
    }
    .btn:active { transform: scale(0.96); }
    .stars { background: linear-gradient(145deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.08)); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.35); }
    .ton { background: linear-gradient(145deg, rgba(56, 189, 248, 0.25), rgba(14, 165, 233, 0.08)); color: #bae6fd; border: 1px solid rgba(56, 189, 248, 0.35); }
    .blue { background: linear-gradient(145deg, rgba(59, 130, 246, 0.48), rgba(37, 99, 235, 0.2)); color: #fff; border: 1px solid rgba(147, 197, 253, 0.4); padding: 13px; font-size: 14px; border-radius: 20px; }
    nav {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      border-radius: 30px;
      display: flex;
      padding: 6px;
      z-index: 20;
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 24px;
      padding: 8px 0;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .nav-btn.active {
      color: #ffffff;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }
  </style>
</head>
<body>
  <header class="glass">
    <div class="logo">🎁 SpinGift</div>
    <button class="ton-btn" onclick="msg('Подключение Tonkeeper скоро будет добавлено')">💎 Подключить TON</button>
  </header>

  <div id="market" class="tab active">
    <div class="card glass">
      <b>Маркетплейс подарков</b>
      <p style="font-size:12px;color:rgba(255,255,255,0.65);margin-top:4px;">Покупка и продажа редких подарков за Stars и TON.</p>
    </div>
    <div class="grid">
      <div class="gift glass"><div class="icon">🧸</div><b>Plush Pepe</b><button class="btn stars" onclick="msg('Покупка за 250 Stars')">⭐ 250 Stars</button><button class="btn ton" onclick="msg('Покупка за 1.5 TON')">💎 1.5 TON</button></div>
      <div class="gift glass"><div class="icon">💎</div><b>Astral Shard</b><button class="btn stars" onclick="msg('Покупка за 800 Stars')">⭐ 800 Stars</button><button class="btn ton" onclick="msg('Покупка за 4.8 TON')">💎 4.8 TON</button></div>
      <div class="gift glass"><div class="icon">🎩</div><b>Durov’s Cap</b><button class="btn stars" onclick="msg('Покупка за 2500 Stars')">⭐ 2500 Stars</button><button class="btn ton" onclick="msg('Покупка за 15 TON')">💎 15 TON</button></div>
      <div class="gift glass"><div class="icon">🔮</div><b>Crystal Ball</b><button class="btn stars" onclick="msg('Покупка за 450 Stars')">⭐ 450 Stars</button><button class="btn ton" onclick="msg('Покупка за 2.7 TON')">💎 2.7 TON</button></div>
    </div>
  </div>

  <div id="tasks" class="tab">
    <div class="card glass">
      <b>📺 Реклама AdsGram</b>
      <p style="font-size:12px;color:rgba(255,255,255,0.65);margin:4px 0 8px;">Смотрите ролик и получайте бонусы.</p>
      <button class="btn blue" onclick="msg('Здесь запустится реклама AdsGram')">Смотреть рекламу</button>
    </div>
    <div class="card glass">
      <b>📢 Канал SpinGift</b>
      <p style="font-size:12px;color:rgba(255,255,255,0.65);margin:4px 0 8px;">Подпишитесь на новости проекта.</p>
      <button class="btn blue" onclick="msg('Проверка подписки')">Перейти</button>
    </div>
  </div>

  <div id="profile" class="tab">
    <div class="card glass" style="text-align:center;">
      <div style="font-size:44px;margin-bottom:8px;">👤</div>
      <b id="uname" style="font-size:17px;">Пользователь</b>
      <p id="uhandle" style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:4px;">@username</p>
    </div>
    <button class="btn blue" onclick="msg('Скоро здесь можно будет выставить свой подарок')">➕ Продать свой подарок</button>
  </div>

  <nav class="glass">
    <button class="nav-btn active" onclick="openTab('market', this)"><span style="font-size:18px;">🛍️</span>Маркет</button>
    <button class="nav-btn" onclick="openTab('tasks', this)"><span style="font-size:18px;">⚡</span>Задания</button>
    <button class="nav-btn" onclick="openTab('profile', this)"><span style="font-size:18px;">👤</span>Профиль</button>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u) {
        document.getElementById('uname').innerText = u.first_name || 'Пользователь';
        document.getElementById('uhandle').innerText = u.username ? '@' + u.username : 'ID: ' + u.id;
      }
    }
    function openTab(id, btn) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
    function msg(t) { tg && tg.showAlert ? tg.showAlert(t) : alert(t); }
  </script>
</body>
</html>
