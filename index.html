<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BitGift</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#0b101d,#162238,#0d1526);color:#fff;min-height:100vh;padding-bottom:150px}
header{padding:16px;text-align:center}
.title{font-size:22px;font-weight:800;margin-bottom:12px;color:#7dd3fc}
.bals{display:flex;gap:8px;justify-content:center}
.pill{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.wrap{padding:0 16px;max-width:500px;margin:0 auto}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:16px;margin-bottom:14px}
.empty{text-align:center;padding:85px 20px;color:#94a3b8;font-size:15px}
.btn{background:rgba(56,189,248,.3);border:1px solid rgba(56,189,248,.6);color:#fff;padding:10px 18px;border-radius:16px;font-size:14px;font-weight:600;cursor:pointer}
.sell-wrap{position:fixed;bottom:84px;left:16px;right:16px;max-width:468px;margin:0 auto;z-index:20}
.btn-sell{width:100%;background:rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.28);color:#fff;padding:14px;border-radius:20px;font-size:15px;font-weight:600;cursor:pointer}
.task{display:flex;justify-content:space-between;align-items:center;gap:12px}
.task h4{font-size:15px;margin-bottom:4px}
.task p{font-size:12px;color:#94a3b8}
.prof{display:flex;align-items:center;gap:14px}
.ava{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid #38bdf8;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0}
.ava img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:12px;font-size:12px;margin-top:6px;color:#cbd5e1}
.nav{position:fixed;bottom:14px;left:16px;right:16px;max-width:468px;margin:0 auto;background:rgba(15,23,42,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.18);border-radius:26px;display:flex;padding:6px;z-index:30}
.nbtn{flex:1;background:0 0;border:none;color:#94a3b8;font-size:14px;font-weight:600;padding:12px 6px;border-radius:20px;cursor:pointer}
.nbtn.act{background:rgba(255,255,255,.16);color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:999;align-items:center;justify-content:center;padding:20px}
.mcard{background:#162238;border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:22px;max-width:330px;width:100%;text-align:center}
.mcard h4{font-size:17px;margin-bottom:8px}
.mcard p{font-size:14px;color:#cbd5e1;margin-bottom:16px}
.gifts-box{margin:16px 0;padding-bottom:90px}
.gifts-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gifts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gift-card{background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px;text-align:center}
.gift-card img{width:74px;height:74px;object-fit:contain}
.gift-title{font-size:13px;font-weight:600;color:#fff;margin-top:8px}

</style>
</head>
<body>

<header>
    <div class="title">BitGift</div>
    <div class="bals">
        <div class="pill">⭐️ 0 Stars</div>
        <div class="pill">💎 0.0 TON</div>
    </div>
</header>

<div class="wrap">
    <div id="p1">
        <div class="empty">Подарков пока нет</div>
        <div class="sell-wrap">
            <button type="button" class="btn-sell" onclick="msg('Продажа','Перешлите подарок нашему боту, чтобы выставить его на маркет.')">➕ Продать</button>
        </div>
    </div>

    <div id="p2" style="display:none">
        <div class="card task">
            <div>
                <h4>📺 Реклама AdsGram</h4>
                <p>Просмотр рекламных роликов</p>
            </div>
            <button type="button" class="btn" onclick="msg('AdsGram','Просмотр рекламы пока не работает — скоро запустим!')">Смотреть</button>
        </div>
    </div>

    <div id="p3" style="display:none">
        <div class="card prof">
            <div id="ava" class="ava">👤</div>
            <div>
                <h3 id="uname">Пользователь</h3>
                <p id="uuser" style="font-size:13px;color:#94a3b8">@username</p>
                <div class="badge">🔒 Синхронизировано с Telegram</div>
            </div>
        </div>
        <div id="ton-connect" style="margin: 12px 0; display: flex; justify-content: center;"></div>
<div class="gifts-box">
  <div class="gifts-head">
    <h4 style="margin:0">Мои подарки</h4>
    <span id="gifts-count" style="font-size:12px;opacity:.7">0</span>
  </div>
  <div id="inventory-grid" class="gifts-grid">
    <p style="grid-column:span 2;text-align:center;opacity:.6;font-size:13px">Загрузка...</p>
  </div>
</div>


    </div>
</div>

<div class="nav">
    <button type="button" id="b1" class="nbtn act" onclick="go(1)">Market</button>
    <button type="button" id="b2" class="nbtn" onclick="go(2)">Задание</button>
    <button type="button" id="b3" class="nbtn" onclick="go(3)">Профиль</button>
</div>

<div id="mod" class="modal" onclick="this.style.display='none'">
    <div class="mcard" onclick="event.stopPropagation()">
        <h4 id="mt"></h4>
        <p id="mp"></p>
        <button type="button" class="btn" style="width:100%" onclick="document.getElementById('mod').style.display='none'">Понятно</button>
    </div>
</div>

<script>
function go(n){
    document.getElementById('p1').style.display=(n===1)?'block':'none';
    document.getElementById('p2').style.display=(n===2)?'block':'none';
    document.getElementById('p3').style.display=(n===3)?'block':'none';
    document.getElementById('b1').className=(n===1)?'nbtn act':'nbtn';
    document.getElementById('b2').className=(n===2)?'nbtn act':'nbtn';
    document.getElementById('b3').className=(n===3)?'nbtn act':'nbtn';
}
function msg(t,p){
    document.getElementById('mt').innerText=t;
    document.getElementById('mp').innerText=p;
    document.getElementById('mod').style.display='flex';
}
try{
    var tg=window.Telegram.WebApp;
    tg.ready();tg.expand();
    var u=tg.initDataUnsafe.user;
    if(u){
        document.getElementById('uname').innerText=(u.first_name||'')+(u.last_name?' '+u.last_name:'');
        document.getElementById('uuser').innerText=u.username?'@'+u.username:'ID: '+u.id;
        if(u.photo_url){document.getElementById('ava').innerHTML='<img src="'+u.photo_url+'">';}
        else if(u.username){document.getElementById('ava').innerHTML='<img src="https://t.me" onerror="this.remove()">';}
    }
}catch(e){}
</script>


<script>
setInterval(function() {
    try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        tg.ready();
        var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (!u && tg.initData) {
            var m = tg.initData.match(/user=([^&]+)/);
            if (m) u = JSON.parse(decodeURIComponent(m));
        }
        if (!u) return;

        var fullName = [u.first_name, u.last_name].filter(Boolean).join(' ');
        var nameEl = document.getElementById('uname') || document.getElementById('user-name');
        var userEl = document.getElementById('uuser') || document.getElementById('user-username');
        var avaEl = document.getElementById('ava') || document.getElementById('user-avatar-box');

        if (nameEl && fullName) nameEl.innerText = fullName;
        if (userEl) userEl.innerText = u.username ? '@' + u.username : 'ID: ' + u.id;
        if (avaEl && !avaEl.querySelector('img')) {
            if (u.photo_url) {
                avaEl.innerHTML = '<img src="' + u.photo_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
            } else if (u.username) {
                avaEl.innerHTML = '<img src="https://t.me' + u.username + '.jpg" onerror="this.remove()" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
            }
        }
    } catch (e) {}
}, 800);
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: 'https://' + 'ton-connect.github.io' + '/demo-dapp-with-react-ui/tonconnect-manifest.json',



  buttonRootId: 'ton-connect'
});
const WORKER_URL = "https://blizeroff.zaharivanov201...workers.dev";

async function loadUserGifts() {
  const tg = window.Telegram && window.Telegram.WebApp;
  const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
  const grid = document.getElementById("inventory-grid");
  const countEl = document.getElementById("gifts-count");
  if (!grid) return;
  if (!userId) {
    grid.innerHTML = '<p style="grid-column:span 2;text-align:center;opacity:.6;font-size:13px">Откройте в Telegram</p>';
    return;
  }
  try {
const res = await fetch(`${WORKER_URL}/gifts?user_id=${userId}`);

    const data = await res.json();
    const gifts = (data.result && data.result.gifts) || [];
    if (countEl) countEl.innerText = gifts.length;
    if (!data.ok || gifts.length === 0) {
      grid.innerHTML = '<p style="grid-column:span 2;text-align:center;opacity:.6;font-size:13px">Подарков пока нет</p>';
      return;
    }
    grid.innerHTML = "";
    gifts.forEach((item) => {
      const g = item.gift;
      const thumb = (g.sticker && g.sticker.thumbnail) || g.sticker;
      const imgUrl = thumb && thumb.file_id ? `${WORKER_URL}/api/file?file_id=${thumb.file_id}` : "";
      const title = item.type === "unique" ? `${g.base_name} #${g.number}` : `Подарок (${g.star_count} ★)`;
      const card = document.createElement("div");
      card.className = "gift-card";
      card.innerHTML = `<img src="${imgUrl}" alt=""><div class="gift-title">${title}</div>`;
      grid.appendChild(card);
    });
  } catch (e) {
grid.innerHTML = `<p style="grid-column:span 2;text-align:center;color:#f87171">${e.message}</p>`;

  }
}
loadUserGifts();

</script>
</body>
</html>
