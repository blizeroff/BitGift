<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitGift — Gift Marketplace</title>
    <!-- Обязательный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b101d 0%, #162238 50%, #0d1526 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновые блики для эффекта жидкого стекла */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: -1;
            opacity: 0.5;
        }
        .blob-1 { width: 250px; height: 250px; background: #0284c7; top: -50px; left: -50px; }
        .blob-2 { width: 300px; height: 300px; background: #4f46e5; bottom: 50px; right: -80px; }

        /* Шапка с валютами */
        header {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #fff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balances {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .currency-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Контейнер вкладок */
        .container {
            padding: 0 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стеклянные карточки */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        /* Маркет */
        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gift-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 0;
        }

        .gift-emoji {
            font-size: 44px;
            margin: 10px 0;
            filter: drop-shadow(0 4px 10px rgba(255,255,255,0.2));
        }

        .gift-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .gift-price {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* Кнопки */
        .btn {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #fff;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-sell {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-border);
            margin-bottom: 16px;
        }

        /* Задания */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .task-info h4 { font-size: 15px; margin-bottom: 4px; }
        .task-info p { font-size: 12px; color: var(--text-muted); }
        .task-item .btn { width: auto; white-space: nowrap; }

        /* Профиль */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid var(--accent);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .user-details h3 { font-size: 18px; }
        .user-details p { font-size: 13px; color: var(--text-muted); }

        .inventory-empty {
            text-align: center;
            padding: 24px 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .lock-badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
            color: #cbd5e1;
        }

        /* Нижняя панель навигации */
        nav {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            max-width: 468px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
        }
    </style>
</head>
