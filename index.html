<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpinGift</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 15% 15%, #2b1d52 0%, #141026 55%, #0b0914 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 98px;
            overflow-x: hidden;
            position: relative;
        }

        /* Декоративные блики для эффекта жидкого стекла */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(75px);
            z-index: -1;
            opacity: 0.55;
            pointer-events: none;
        }
        .orb-1 { width: 220px; height: 220px; background: #7c3aed; top: -40px; left: -40px; }
        .orb-2 { width: 260px; height: 260px; background: #2563eb; bottom: 80px; right: -60px; }

        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 1px var(--glass-highlight);
        }

        /* Верхняя панель */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-radius: 0 0 24px 24px;
            border-top: none;
        }

        .brand {
            text-align: center;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.3px;
            background: linear-gradient(90deg, #fff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balances {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .bal-pill {
            padding: 5px 11px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .container { padding: 16px; max-width: 480px; margin: 0 auto; }

        .tab-content { display: none; animation: fadeIn 0.22s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Заголовок маркета и кнопка Продать */
        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title { font-size: 18px; font-weight: 700; }

        .btn-sell-main {
            padding: 9px 16px;
            border-radius: 14px;
            border: 1px solid rgba(52, 211, 153, 0.45);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(5, 150, 105, 0.2));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sell-main:active { transform: scale(0.96); }

        /* Фильтры валют */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            cursor: pointer;
        }

        .filter-chip.active {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Пустая витрина */
        .empty-state {
            border-radius: 24px;
            padding: 38px 20px;
            text-align: center;
            margin-top: 6px;
        }

        .empty-icon { font-size: 46px; margin-bottom: 10px; }
        .empty-state h3 { font-size: 16px; margin-bottom: 6px; }
        .empty-state p { font-size: 13px; color: var(--text-muted); line-height: 1.45; }

        /* Карточки лотов */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .gift-card {
            border-radius: 22px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .gift-icon {
            font-size: 46px;
            margin: 6px 0 8px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
        }

        .gift-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .gift-seller { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }

        .btn {
            width: 100%;
            padding: 10px 12px;
            border-radius: 14px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
        }

        .btn:active { opacity: 0.85; }
        .btn-danger {
            background: rgba(239, 68, 68, 0.22);
            border: 1px solid rgba(239, 68, 68, 0.45);
            box-shadow: none;
            color: #fca5a5;
        }

        /* Реклама AdsGram */
        .ad-slot {
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 14px;
            text-align: center;
        }

        /* Профиль */
        .profile-card {
            border-radius: 24px;
            padding: 22px 18px;
            text-align: center;
            margin-bottom: 16px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .info-box {
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        /* Нижняя закруглённая панель */
        nav.bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            max-width: 448px;
            margin: 0 auto;
            border-radius: 28px;
            padding: 7px;
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 9px 4px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        .nav-icon { font-size: 18px; }

        /* Нижняя шторка продажи */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 300;
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            width: 100%;
            max-width: 480px;
            border-radius: 28px 28px 0 0;
            padding: 20px 16px 28px;
            background: rgba(24, 19, 46, 0.96);
            border-top: 1px solid var(--glass-border);
            max-height: 85vh;
            overflow-y: auto;
        }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0 16px;
        }

            border-radius: 16px;
