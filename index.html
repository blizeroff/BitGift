<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitGift</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070a12 0%, #111827 50%, #090d16 100%);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-highlight: rgba(255, 255, 255, 0.28);
            --green-glass: rgba(34, 197, 94, 0.22);
            --green-border: rgba(74, 222, 128, 0.45);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 130px;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновые световые пятна для глубины жидкого стекла */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(75px);
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }
        .blob-1 { width: 240px; height: 240px; background: #2563eb; top: -50px; left: -50px; }
        .blob-2 { width: 220px; height: 220px; background: #7c3aed; bottom: 60px; right: -40px; }

        /* Базовый стиль жидкого стекла */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--glass-highlight);
        }

        /* Верхняя шапка */
        header {
            padding: 14px 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-align: center;
            background: linear-gradient(90deg, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* Плашка валют справа сверху */
        .top-currencies-wrap {
            width: 100%;
            display: flex;
            justify-content: flex-end;
        }

        .currency-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
        }

        .curr-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .curr-locked {
            color: var(--text-muted);
            opacity: 0.75;
            cursor: pointer;
        }

        /* Контейнер вкладок */
        .container {
            padding: 12px 16px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Пустой маркет */
        .empty-state {
            margin-top: 60px;
            padding: 28px 20px;
            border-radius: 24px;
            text-align: center;
        }
        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Сетка выставленных товаров в маркете */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        .gift-card {
            padding: 14px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gift-card .emoji { font-size: 44px; margin: 8px 0; }
        .gift-card .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .gift-card .seller { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
        .gift-card .buy-btn {
            width: 100%;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.4);
            background: rgba(59, 130, 246, 0.25);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Маленькая зелёная кнопка Продать над навигацией */
        .sell-btn-container {
            position: fixed;
            bottom: 84px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 90;
            pointer-events: none;
        }

        .sell-btn {
            pointer-events: auto;
            padding: 8px 22px;
            border-radius: 14px;
            background: var(--green-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--green-border);
            box-shadow: 0 6px 24px rgba(34, 197, 94, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .sell-btn:active {
            transform: scale(0.95);
        }

        /* Вкладка Задания */
        .task-card {
            padding: 16px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .task-info h4 { font-size: 15px; margin-bottom: 4px; }
        .task-info p { font-size: 12px; color: var(--text-muted); }
        .ad-btn {
            padding: 9px 16px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .ad-btn:active { transform: scale(0.95); }

        /* Вкладка Профиль */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .avatar-wrapper {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .profile-username {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Чек-лист валют в профиле */
        .wallet-checklist {
            border-radius: 22px;
            padding: 8px 16px;
        }
        .check-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .check-row:last-child {
            border-bottom: none;
        }
        .check-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .check-right {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .connect-ton-btn {
            margin-top: 16px;
            width: 100%;
            padding: 13px;
            border-radius: 16px;
            border: 1px solid rgba(59, 130, 246, 0.5);
            background: rgba(59, 130, 246, 0.22);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .connect-ton-btn:active { transform: scale(0.98); }

        /* Нижняя навигация: компактная, по центру, закруглённая */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }

        nav {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 24px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 18px;
            border-radius: 18px;
