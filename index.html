<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitGift</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0b101d 0%, #162238 50%, #0d1526 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 160px;
        }

        header {
            padding: 16px;
            text-align: center;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #7dd3fc;
        }

        .balances {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .currency-pill {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .container {
            padding: 0 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .empty-market {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
            font-size: 15px;
        }

        .btn {
            background: rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Кнопка Продать строго над нижней панелью */
        .sell-box {
            position: fixed;
            bottom: 84px;
            left: 16px;
            right: 16px;
            max-width: 468px;
            margin: 0 auto;
            z-index: 500;
        }

        .btn-sell {
            width: 100%;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #ffffff;
            padding: 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .btn-sell:active {
            background: rgba(255, 255, 255, 0.24);
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .task-info h4 { font-size: 15px; margin-bottom: 4px; }
        .task-info p { font-size: 12px; color: #94a3b8; }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-wrap {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #38bdf8;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details h3 { font-size: 18px; }
        .user-details p { font-size: 13px; color: #94a3b8; }

        .lock-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 6px;
            color: #cbd5e1;
        }

        .inventory-empty {
            text-align: center;
            padding: 20px 10px;
            color: #94a3b8;
            font-size: 14px;
        }

        /* Нижняя панель из 3 вкладок */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            max-width: 468px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 26px;
            display: flex;
            padding: 6px;
            z-index: 1000;
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 8px;
            border-radius: 20px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">BitGift</div>
        <div class="balances">
            <div class="currency-pill">⭐️ 0 Stars</div>
            <div class="currency-pill">💎 0.0 TON</div>
            <div class="currency-pill">🪙 0 Gram</div>
        </div>
    </header>

    <div class="container">
        <!-- Вкладка 1: Market -->
        <div id="tab-market" class="tab-content active">
            <div class="empty-market">Подарков пока нет</div>
            <div class="sell-box">
                <button type="button" class="btn-sell" id="sell-btn">➕ Продать</button>
            </div>
        </div>

        <!-- Вкладка 2: Задание -->
        <div id="tab-tasks" class="tab-content">
            <div class="glass-card task-item">
                <div class="task-info">
                    <h4>📺 Реклама AdsGram</h4>
                    <p>Просмотр рекламных роликов</p>
                </div>
                <button type="button" class="btn" id="ad-btn">Смотреть</button>
            </div>
        </div>

        <!-- Вкладка 3: Профиль -->
        <div id="tab-profile" class="tab-content">
            <div class="glass-card profile-header">
                <div id="user-avatar-box" class="avatar-wrap">👤</div>
                <div class="user-details">
                    <h3 id="user-name">Загрузка...</h3>
                    <p id="user-username">@username</p>
                    <div class="lock-badge">🔒 Синхронизировано с Telegram</div>
                </div>
            </div>
            <div class="glass-card">
                <h4 style="margin-bottom: 8px;">🎒 Инвентарь подарков</h4>
                <div class="inventory-empty">
                    🔒 Ваши подарки хранятся напрямую в вашем аккаунте Telegram.
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button type="button" class="nav-btn active" onclick="openTab('market', this)">Market</button>
        <button type="button" class="nav-btn" onclick="openTab('tasks', this)">Задание</button>
        <button type="button" class="nav-btn" onclick="openTab('profile', this)">Профиль</button>
    </div>

    <script>

        if (tg) {
            tg.ready();
            tg.expand();
        }

        function notify(text) {
            if (tg && tg.showAlert) {
                tg.showAlert(text);
            } else {
                alert(text);
            }
        }

        function openTab(name, btn) {
            var tabs = document.querySelectorAll('.tab-content');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            var btns = document.querySelectorAll('.nav-btn');
            for (var j = 0; j < btns.length; j++) {
                btns[j].classList.remove('active');
            }
            document.getElementById('tab-' + name).classList.add('active');
            btn.classList.add('active');
        }

            notify('Перешлите подарок боту в личные сообщения, чтобы выставить его на продажу.');
        };
